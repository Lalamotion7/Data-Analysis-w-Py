<!doctype html>
<html lang="pt-BR">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa do Mundo 2026 — Dashboard de Estatísticas</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-base: #0a0d14;
  --surface: rgba(255, 255, 255, 0.03);
  --surface2: rgba(255, 255, 255, 0.06);
  --fg: #f1f5f9;
  --muted: #94a3b8;
  --border: rgba(255, 255, 255, 0.08);
  --accent: #10b981; 
  --accent-glow: rgba(16, 185, 129, 0.4);
  --accent2: #3b82f6; 
  --accent2-glow: rgba(59, 130, 246, 0.4);
  --success: #10b981;
  --danger: #ef4444;
  --font-display: 'Inter', system-ui, -apple-system, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --radius: 16px;
  --radius-sm: 8px;
}
html { font-size: 15px; }
body {
  font-family: var(--font-body);
  background-color: var(--bg-base);
  background-image: 
    radial-gradient(circle at 15% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
  background-attachment: fixed;
  color: var(--fg);
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.container { max-width: 1440px; margin: 0 auto; padding: 0 24px; width: 100%; }

/* HEADER PREMIUM */
header {
  padding: 24px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  background: rgba(10, 13, 20, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo svg { width: 34px; height: 34px; flex-shrink: 0; filter: drop-shadow(0 0 8px var(--accent-glow)); }
.logo h1 { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em; color: var(--fg); }
.logo span { color: var(--muted); font-size: 0.85rem; font-weight: 400; text-transform: uppercase; letter-spacing: 0.1em; margin-left: 6px; }

/* INPUTS E SELECTS */
.header-right { display: flex; align-items: center; gap: 20px; }
.header-right select {
  background: var(--surface2);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  min-width: 200px;
  outline: none;
  transition: all 0.2s ease;
  backdrop-filter: blur(8px);
}
.header-right select:hover, .header-right select:focus {
  border-color: var(--muted);
  background: rgba(255, 255, 255, 0.08);
}
.header-right select option {
  background-color: var(--bg-base);
  color: var(--fg);
  font-weight: 500;
}
.header-right label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
.team-select-group { display: flex; align-items: center; gap: 12px; }

/* CARROSSEL DE JOGOS CENTRALIZADO (NOVO) */
.match-stripe-container { margin: 32px auto 0; display: flex; flex-direction: column; align-items: center; width: 100%; }
.match-date-header { 
  font-family: var(--font-display); font-size: 0.8rem; font-weight: 700; color: var(--accent); 
  text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 20px; text-align: center; 
  background: rgba(16, 185, 129, 0.1); padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.2);
}
.match-stripe { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; width: 100%; }
.match-card {
  width: 220px; background: rgba(0,0,0,0.4); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 16px; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(8px);
}
.match-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); background: rgba(255,255,255,0.05); }
.match-time { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; margin-bottom: 4px; font-weight: 600;}
.match-team { display: flex; align-items: center; justify-content: space-between; }
.match-team-left { display: flex; align-items: center; gap: 10px; }
.match-team .flag-xs { width: 24px; height: 18px; border-radius: 3px; object-fit: cover; box-shadow: 0 1px 4px rgba(0,0,0,0.5);}
.match-team .name { font-weight: 600; font-size: 0.9rem; color: var(--fg); }

/* CARTÕES EFEITO VIDRO (GLASSMORPHISM) */
.card {
  background: var(--surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
  transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
.card:hover {
  transform: translateY(-4px);
  border-color: rgba(255, 255, 255, 0.15);
  box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
}
.card-title {
  font-family: var(--font-display);
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-bottom: 20px;
}

/* GRIDS E ESTILOS GERAIS */
.overview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 24px; }
.confronto-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
.three-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-top: 16px; }
.section-title { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; margin-top: 40px; color: var(--fg); display: flex; align-items: center; gap: 12px; }
.section-title small { font-size: 0.75rem; font-weight: 500; color: var(--accent2); text-transform: uppercase; letter-spacing: 0.1em; }
.stat-card { text-align: center; padding: 20px 16px; }
.stat-value { font-family: var(--font-mono); font-size: 2.2rem; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.stat-label { font-size: 0.75rem; color: var(--muted); margin-top: 8px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;}
.stat-sub { font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-top: 4px; }
.team-compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: center; padding: 32px 0; }
.team-side { text-align: center; }
.team-side .flag-lg { width: 80px; height: 60px; border-radius: 6px; object-fit: cover; display: inline-block; box-shadow: 0 8px 24px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); }
.team-side .name { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; letter-spacing: -0.03em; margin-top: 16px; }
.team-side .record { font-family: var(--font-mono); font-size: 0.9rem; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
.team-side .group-badge { font-size: 0.7rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 8px; font-weight: 600; }
.vs-badge { background: linear-gradient(135deg, var(--surface2), rgba(255,255,255,0.02)); border: 1px solid var(--border); border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 1rem; font-weight: 800; letter-spacing: 0.05em; color: var(--fg); box-shadow: inset 0 2px 10px rgba(255,255,255,0.05), 0 8px 24px rgba(0,0,0,0.3); }
.bar-compare { margin-top: 12px; }
.bar-row { display: grid; grid-template-columns: 90px 1fr 45px 1fr 90px; gap: 12px; align-items: center; margin-bottom: 16px; }
.bar-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; text-align: right; font-weight: 600;}
.bar-label.right { text-align: left; }
.bar-value { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600; font-variant-numeric: tabular-nums; text-align: center; color: var(--fg); }
.bar-track { height: 8px; background: rgba(0,0,0,0.3); border-radius: 4px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.05);}
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
.bar-fill.team-a { background: linear-gradient(90deg, #059669, var(--accent)); box-shadow: 0 0 10px var(--accent-glow); }
.bar-fill.team-b { background: linear-gradient(90deg, #2563eb, var(--accent2)); box-shadow: 0 0 10px var(--accent2-glow); }
.radar-container { position: relative; width: 100%; max-width: 360px; margin: 0 auto; }
.prob-container { padding: 12px 0; }
.prob-bar { display: flex; height: 40px; border-radius: var(--radius-sm); overflow: hidden; margin: 16px 0; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);}
.prob-a { background: linear-gradient(90deg, #059669, var(--accent)); transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.9rem; font-weight: 700; color: #000; text-shadow: 0 1px 2px rgba(255,255,255,0.3); }
.prob-draw { background: var(--surface2); transition: width 0.8s ease; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600; color: var(--muted); }
.prob-b { background: linear-gradient(90deg, #2563eb, var(--accent2)); transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.9rem; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
.prob-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); margin-bottom: 8px;}
.prob-labels strong { color: var(--fg); font-size: 0.9rem;}
.data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.data-table th { text-align: left; padding: 16px 12px; font-family: var(--font-display); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); }
.data-table td { padding: 14px 12px; border-bottom: 1px solid rgba(255,255,255,0.03); font-variant-numeric: tabular-nums; transition: background 0.2s; }
.data-table tr:hover td { background: rgba(255,255,255,0.05); }
.data-table .num { font-family: var(--font-mono); text-align: right; font-weight: 500;}
.data-table .team-cell { display: flex; align-items: center; gap: 12px; }
.data-table .team-cell .flag-sm { width: 24px; height: 18px; border-radius: 3px; object-fit: cover; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
.data-table .team-cell .name { font-weight: 600; letter-spacing: -0.01em;}
.data-table .rank { color: var(--muted); font-family: var(--font-mono); width: 32px; text-align: center;}
.sparkline { height: 60px; width: 100%; margin-top: 8px;}
.sparkline svg { width: 100%; height: 100%; overflow: visible; }
.month-label { font-size: 0.65rem; color: var(--muted); text-align: center; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.05em;}
.stats-inline { display: flex; gap: 16px; flex-wrap: wrap; }
.stat-pill { display: flex; align-items: baseline; gap: 8px; background: rgba(0,0,0,0.2); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);}
.stat-pill .pill-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;}
.stat-pill .pill-value { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-pill .pill-value.team-a-color { color: var(--accent); text-shadow: 0 0 8px var(--accent-glow);}
.stat-pill .pill-value.team-b-color { color: var(--accent2); text-shadow: 0 0 8px var(--accent2-glow);}
.section { margin-top: 48px; }
.section:first-of-type { margin-top: 0; }
.group-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.group-filter button { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 20px; padding: 6px 16px; font-family: var(--font-body); font-size: 0.8rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); text-transform: uppercase; letter-spacing: 0.05em; }
.group-filter button:hover { border-color: var(--accent); color: var(--fg); background: rgba(255,255,255,0.05);}
.group-filter button.active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

@media (max-width: 1024px) {
  .overview-grid { grid-template-columns: repeat(2, 1fr); }
  .three-grid { grid-template-columns: 1fr 1fr 1fr; }
}
@media (max-width: 640px) {
  .container { padding: 0 16px; }
  .overview-grid { grid-template-columns: 1fr 1fr; }
  .confronto-grid { grid-template-columns: 1fr; }
  .three-grid { grid-template-columns: 1fr; }
  .bar-row { grid-template-columns: 60px 1fr 30px 1fr 60px; }
  header { flex-direction: column; align-items: stretch; padding: 16px 0;}
  .header-right { flex-direction: column; align-items: stretch;}
  .team-select-group { width: 100%; flex-direction: column; align-items: flex-start; gap: 4px;}
  .header-right select { width: 100%; min-width: 0; }
  .team-compare { grid-template-columns: 1fr; gap: 16px; padding: 16px 0; }
  .vs-badge { margin: 0 auto; width: 40px; height: 40px; font-size: 0.8rem; }
}
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-base); }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
.loading { text-align: center; padding: 100px 20px; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; }

/* === ESTILOS DO CAMPO TÁTICO === */
.pitch-container {
  width: 100%;
  height: 320px;
  background: linear-gradient(180deg, rgba(16, 185, 129, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  position: relative;
  overflow: hidden;
}
.pitch-line-center { position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border); transform: translateY(-50%); }
.pitch-circle { position: absolute; top: 50%; left: 50%; width: 70px; height: 70px; border: 1px solid var(--border); border-radius: 50%; transform: translate(-50%, -50%); }
.pitch-area-top { position: absolute; top: 0; left: 25%; right: 25%; height: 45px; border: 1px solid var(--border); border-top: none; }
.pitch-area-bottom { position: absolute; bottom: 0; left: 25%; right: 25%; height: 45px; border: 1px solid var(--border); border-bottom: none; }
.player-dot {
  position: absolute; width: 14px; height: 14px; border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 4px 8px rgba(0,0,0,0.6);
}
.player-a { background: var(--accent); border: 2px solid #fff; }
.player-b { background: var(--accent2); border: 2px solid #fff; }

</style>
</head>

  <div class="logo">
    <img src="img/logo.png" width="30px" height="30px" alt="Sua Nova Logomarca" style="margin-left: 15px;">
    <div>
      <h1>Copa 2026 <span>QG de Análises</span></h1>
    </div>

  <div class="header-right">
    <div class="team-select-group">

      <label>Time B</label>

function renderPitch(formationStr, isTeamA) {
  var lines = formationStr.split('-'); // Corta "4-3-3" em ['4', '3', '3']
  var colorClass = isTeamA ? 'player-a' : 'player-b';
  
  var html = '<div class="pitch-container">' +
               '<div class="pitch-line-center"></div>' +
               '<div class="pitch-circle"></div>' +
               '<div class="pitch-area-top"></div>' +
               '<div class="pitch-area-bottom"></div>';

  // O Goleirão sempre na base
  html += '<div class="player-dot ' + colorClass + '" style="top: 90%; left: 50%;"></div>';

  // Distribui as linhas de defesa para o ataque
  var startY = 75; // Zaga fica a 75% da altura
  var endY = 15;   // Ataque fica a 15% da altura
  var stepY = (startY - endY) / (lines.length - 1 || 1);

  for(var i = 0; i < lines.length; i++) {
     var playersCount = parseInt(lines[i]);
     var currentY = startY - (i * stepY);
     var stepX = 100 / (playersCount + 1); // Divide a largura igualmente
     
     for(var p = 1; p <= playersCount; p++) {
        var currentX = p * stepX;
        html += '<div class="player-dot ' + colorClass + '" style="top: ' + currentY + '%; left: ' + currentX + '%;"></div>';
     }
  }
  html += '</div>';
  return html;
}

function genHistoryRealista(mediaGols, mediaSofridos, winRate) {
  var h = [];
  var months = ['Jan 24','Fev 24','Mar 24','Abr 24','Mai 24','Jun 24','Jul 24','Ago 24','Set 24','Out 24','Nov 24','Dez 24'];
  months.forEach(function(m) {
    h.push({ 
      month: m, 
      goalsScored: Math.max(0, mediaGols + (Math.random() - 0.5)), 
      goalsConceded: Math.max(0, mediaSofridos + (Math.random() - 0.5)),
      result: Math.random() * 100 < winRate ? 'V' : (Math.random() > 0.5 ? 'E' : 'D')
    });
  });
  return h;
}

function createHistorySparkline(hist, metric) {
  if(!hist || hist.length === 0) return '';
  var vals = hist.map(function(h) { return h[metric]; });
  var max = Math.max.apply(null, vals) * 1.15;
  var min = 0;
  var w = 100; var hc = 40;
  var pts = vals.map(function(v,i) { return ((i/(vals.length-1))*w) + ',' + (hc - ((v-min)/(max-min))*hc); }).join(' ');
  var color = metric === 'goalsScored' ? 'oklch(62% 0.18 145)' : 'oklch(58% 0.2 25)';
  var lastPt = pts.split(' ').pop().split(',');
  return '<svg viewBox="0 0 ' + w + ' ' + hc + '" xmlns="http://www.w3.org/2000/svg">' +
    '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="' + lastPt[0] + '" cy="' + lastPt[1] + '" r="2" fill="' + color + '"/>' +
    '</svg>';
}

function renderRadar(statsA, statsB) {

    { key: 'goalsScored', label: 'Gols Marcados', max: 3 },
    { key: 'possession', label: 'Posse', max: 80 },
    { key: 'escanteios', label: 'Escanteios', max: 10 },
    { key: 'shotsFor', label: 'Finalizações', max: 20 },
    { key: 'winRate', label: 'Vitórias', max: 100 },
    { key: 'recuperadas', label: 'Recuperadas', max: 60 }
  ];
  var levels = 4;
  
  // 👇 AJUSTE DE ÁREA DE ESCAPE: Aumentamos o tamanho total do SVG e mudamos o centro
  var cx = 150; var cy = 150; var r = 90; // Diminuímos o raio de 100 para 90 para dar mais margem ainda
  var angleStep = (2 * Math.PI) / metrics.length;
  var rotation = -Math.PI / 2;
  
  // Mudamos o viewBox para 300x300 para o texto ter espaço para respirar nas pontas
  var svg = '<svg width="100%" height="100%" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">';

  for (var l = 1; l <= levels; l++) {
    var lr = (r / levels) * l;
    var pts = metrics.map(function(_, i) {
      var a = rotation + i * angleStep;
      return (cx + lr * Math.cos(a)) + ',' + (cy + lr * Math.sin(a));
    }).join(' ');
    svg += '<polygon points="' + pts + '" fill="none" stroke="oklch(25% 0.015 250)" stroke-width="0.5"/>';
  }

  metrics.forEach(function(_, i) {
    var a = rotation + i * angleStep;
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + r * Math.cos(a)) + '" y2="' + (cy + r * Math.sin(a)) + '" stroke="oklch(25% 0.015 250)" stroke-width="0.5"/>';
  });

  var ptsA = metrics.map(function(m) {
    var v = statsA[m.key] / m.max;
    var a = rotation + metrics.indexOf(m) * angleStep;
    return (cx + v * r * Math.cos(a)) + ',' + (cy + v * r * Math.sin(a));
  }).join(' ');
  svg += '<polygon points="' + ptsA + '" fill="oklch(62% 0.18 145 / 0.12)" stroke="oklch(62% 0.18 145)" stroke-width="1.5" stroke-linejoin="round"/>';
  metrics.forEach(function(m) {
    var v = statsA[m.key] / m.max;
    var a = rotation + metrics.indexOf(m) * angleStep;
    svg += '<circle cx="' + (cx + v * r * Math.cos(a)) + '" cy="' + (cy + v * r * Math.sin(a)) + '" r="2.5" fill="oklch(62% 0.18 145)"/>';
  });

  var ptsB = metrics.map(function(m) {
    var v = statsB[m.key] / m.max;
    var a = rotation + metrics.indexOf(m) * angleStep;
    return (cx + v * r * Math.cos(a)) + ',' + (cy + v * r * Math.sin(a));
  }).join(' ');
  svg += '<polygon points="' + ptsB + '" fill="oklch(58% 0.18 255 / 0.12)" stroke="oklch(58% 0.18 255)" stroke-width="1.5" stroke-linejoin="round"/>';
  metrics.forEach(function(m) {
    var v = statsB[m.key] / m.max;
    var a = rotation + metrics.indexOf(m) * angleStep;
    svg += '<circle cx="' + (cx + v * r * Math.cos(a)) + '" cy="' + (cy + v * r * Math.sin(a)) + '" r="2.5" fill="oklch(58% 0.18 255)"/>';
  });

  metrics.forEach(function(m) {
    var a = rotation + metrics.indexOf(m) * angleStep;
    // Puxamos a label um pouquinho mais para perto do gráfico (de 18 para 14) para garantir
    var lx = cx + (r + 14) * Math.cos(a);
    var ly = cy + (r + 14) * Math.sin(a);
    var anchor = a > -Math.PI/2 && a < Math.PI/2 ? 'start' : a === Math.PI/2 || a === -Math.PI/2 ? 'middle' : 'end';
    
    // 👇 Aumentamos um pouquinho a fonte para 9px para melhorar a leitura na tela
    svg += '<text x="' + lx + '" y="' + ly + '" text-anchor="' + anchor + '" dominant-baseline="middle" font-size="9" fill="oklch(75% 0.012 250)" font-family="-apple-system, system-ui, sans-serif">' + m.label + '</text>';
  });

  svg += '</svg>';
  return svg;
}

// MOTOR MATEMÁTICO DEFINITIVO - O REI DO BOLÃO (COM xG)
function computeProb(a, b) {
  var sA = GM[a.id].stats;
  var sB = GM[b.id].stats;
  var hA = GM[a.id].history;
  var hB = GM[b.id].history;
  
  // 1. O Pulo do Gato (xG)
  // Se o JSON já tiver o xG, usa ele. Se não, usa o Gol Real como fallback (estepe).
  var xG_A = sA.xGFor || sA.goalsScored;
  var xG_B = sB.xGFor || sB.goalsScored;
  var xGAgainst_A = sA.xGAgainst || sA.goalsConceded;
  var xGAgainst_B = sB.xGAgainst || sB.goalsConceded;

  // 2. Índices Táticos Refinados (Gols Esperados valem ouro agora)
  var ataqueA = (sA.shotsFor * 0.5) + (sA.escanteios * 0.5) + (xG_A * 4);
  var ataqueB = (sB.shotsFor * 0.5) + (sB.escanteios * 0.5) + (xG_B * 4);

  // 3. Defesa (Penalizada drasticamente pela qualidade das chances cedidas)
  var defesaA = (sA.possession * 0.3) + (sA.recuperadas * 0.5) - (sA.shotsAgainst * 0.5) - (xGAgainst_A * 3);
  var defesaB = (sB.possession * 0.3) + (sB.recuperadas * 0.5) - (sB.shotsAgainst * 0.5) - (xGAgainst_B * 3);

  defesaA = Math.max(1, defesaA);
  defesaB = Math.max(1, defesaB);

  var forcaTaticaA = (ataqueA / defesaB) * (sA.winRate > 0 ? sA.winRate / 10 : 1);
  var forcaTaticaB = (ataqueB / defesaA) * (sB.winRate > 0 ? sB.winRate / 10 : 1);

  // 4. CORREÇÃO DE VIÉS: Elevando o peso da força global ao cubo (Blindagem contra zebras)
  var pesoCamisaA = Math.pow((a.strength / 100), 3);
  var pesoCamisaB = Math.pow((b.strength / 100), 3);

  var forcaFinalA = forcaTaticaA * pesoCamisaA;
  var forcaFinalB = forcaTaticaB * pesoCamisaB;
  var totalForca = forcaFinalA + forcaFinalB;
  
  // 5. Mapeamento do Histórico Factual de Empates
  var empatesA = hA.length > 0 ? hA.filter(function(h){return h.result === 'E'}).length / hA.length : 0.25;
  var empatesB = hB.length > 0 ? hB.filter(function(h){return h.result === 'E'}).length / hB.length : 0.25;
  var mediaEmpatesHistorico = (empatesA + empatesB) / 2; 

  // 6. Nível de Equivalência Tática
  var simPosse = 1 - (Math.abs(sA.possession - sB.possession) / 100); 
  var simGols = 1 - Math.min(Math.abs(xG_A - xG_B) / 3, 1); // Semelhança baseada em xG
  var fatorSemelhanca = (simPosse + simGols) / 2;

  // 7. Cálculo da Disparidade Real entre os dois Tiers
  var disparidade = Math.abs(forcaFinalA - forcaFinalB) / totalForca;
  
  // Cálculo de Empate blindado
  var chanceEmpate = 10 + (mediaEmpatesHistorico * 100 * 0.5) + (fatorSemelhanca * 10) - (disparidade * 30);
  chanceEmpate = Math.max(5, Math.min(38, chanceEmpate));
  
// 8. Distribuição Proporcional Perfeita (Blindagem de Inteiros)
  // Calculamos os valores exatos com decimais
  var drawPrecise = chanceEmpate;
  var porcentagemRestante = 100 - drawPrecise;
  var pAPrecise = (forcaFinalA / totalForca) * porcentagemRestante;
  
  // Arredondamos o Empate e o Time A para números redondos (sem vírgula)
  var draw = Math.round(drawPrecise);
  var pA = Math.round(pAPrecise);
  
  // O Time B absorve o resto exato da matemática inteira! Impossível passar de 100.
  var pB = 100 - draw - pA;
  
  return { pA: pA, pB: pB, draw: draw };
}

// === RENDERIZA A FAIXA DE JOGOS NO MEIO DA TELA ===
function renderMatchStripe() {
  var today = new Date();
  var yyyy = today.getFullYear();
  var mm = String(today.getMonth() + 1).padStart(2, '0');
  var dd = String(today.getDate()).padStart(2, '0');
  var todayStr = yyyy + '-' + mm + '-' + dd;

  var targetDate = todayStr;
  var isNext = false;

  // Inteligência: Se a data do PC não tiver jogo, procura automaticamente o próximo dia de rodada!
  if (!SCHEDULE[targetDate]) {
    var dates = Object.keys(SCHEDULE).sort();
    var nextDate = dates.find(function(d) { return d > todayStr; });
    if (nextDate) {
      targetDate = nextDate;
      isNext = true;
    } else {
      targetDate = dates[0]; // Volta pro começo se a Copa acabou
    }
  }

  var matches = SCHEDULE[targetDate];
  if (!matches) return '';

  var parts = targetDate.split('-');
  var displayDD = parts[2];
  var displayMM = parts[1];
  var title = isNext ? "PRÓXIMA RODADA (" + displayDD + "/" + displayMM + ")" : "JOGOS DO DIA (" + displayDD + "/" + displayMM + ")";

  var html = '<div class="match-stripe-container"><div class="match-date-header">' + title + '</div><div class="match-stripe">';

  matches.forEach(function(m) {
    var tA = TEAMS.find(function(t) { return t.id === m.idA; });
    var tB = TEAMS.find(function(t) { return t.id === m.idB; });
    if(!tA || !tB) return;

    html += '<div class="match-card" onclick="selectMatch(\'' + m.idA + '\', \'' + m.idB + '\')">' +
              '<div class="match-time">⏱ ' + m.time + '</div>' +
              '<div class="match-team">' +
                '<div class="match-team-left">' + flagImg(tA.id, 40, 'flag-xs') + '<span class="name">' + tA.name + '</span></div>' +
              '</div>' +
              '<div class="match-team">' +
                '<div class="match-team-left">' + flagImg(tB.id, 40, 'flag-xs') + '<span class="name">' + tB.name + '</span></div>' +
              '</div>' +
            '</div>';
  });

  html += '</div></div>';
  return html;
}

  var barsHtml = '';
  for (var mi = 0; mi < barMetrics.length; mi++) {
    barsHtml += buildBarRow(barMetrics[mi], sA[barMetrics[mi].key], sB[barMetrics[mi].key]);
  }

  var tableHtml = '';
  for (var ri = 0; ri < filtered.length; ri++) {
    tableHtml += buildTableRow(filtered[ri], ri);
  }

  var hAavg = hA.length > 0 ? (hA.reduce(function(a,b) { return a + b.goalsScored; }, 0) / hA.length).toFixed(1) : 0;
  var hBavg = hB.length > 0 ? (hB.reduce(function(a,b) { return a + b.goalsScored; }, 0) / hB.length).toFixed(1) : 0;
  var hAv = hA.filter(function(h) { return h.result === 'V'; }).length;
  var hAe = hA.filter(function(h) { return h.result === 'E'; }).length;
  var hAd = hA.filter(function(h) { return h.result === 'D'; }).length;
  var hBv = hB.filter(function(h) { return h.result === 'V'; }).length;
  var hBe = hB.filter(function(h) { return h.result === 'E'; }).length;
  var hBd = hB.filter(function(h) { return h.result === 'D'; }).length;
  var hAcavg = hA.length > 0 ? (hA.reduce(function(a,b) { return a + b.goalsConceded; }, 0) / hA.length).toFixed(1) : 0;
  var hBcavg = hB.length > 0 ? (hB.reduce(function(a,b) { return a + b.goalsConceded; }, 0) / hB.length).toFixed(1) : 0;

  var potencial_gols_jogo = ((sA.goalsScored + sB.goalsConceded) / 2) + ((sB.goalsScored + sA.goalsConceded) / 2);
  var pesoA = prob.pA / (prob.pA + prob.pB);
  var pesoB = prob.pB / (prob.pA + prob.pB);
  var xG_A = potencial_gols_jogo * pesoA;
  var xG_B = potencial_gols_jogo * pesoB;
  var total_xG = xG_A + xG_B;
  var ambosMarcam = Math.min(95, Math.max(10, (xG_A * xG_B * 20)));

  // === AQUI A VITRINE DE JOGOS É INJETADA NO MEIO DA TELA ===
  var stripeHtml = renderMatchStripe();

  var app = document.getElementById('app');
  app.innerHTML =
    '<div class="section" style="margin-top: 16px;">' +
      '<div class="team-compare card" style="border:none;background:transparent;padding:0;">' +
        '<div class="team-side">' +
          '<div class="flag-lg">' + flagImg(idA, 80, 'flag-lg') + '</div>' +
          '<div class="name">' + teamA.name + '</div>' +
          '<div class="record">' + sA.winRate.toFixed(0) + '% vit\u00f3rias \u00b7 ' + sA.goalsScored.toFixed(1) + ' \u26bd/j</div>' +
          '<div class="group-badge">Grupo ' + teamA.grp + '</div>' +
        '</div>' +
        '<div class="vs-badge">VS</div>' +
        '<div class="team-side">' +
          '<div class="flag-lg">' + flagImg(idB, 80, 'flag-lg') + '</div>' +
          '<div class="name">' + teamB.name + '</div>' +
          '<div class="record">' + sB.winRate.toFixed(0) + '% vit\u00f3rias \u00b7 ' + sB.goalsScored.toFixed(1) + ' \u26bd/j</div>' +
          '<div class="group-badge">Grupo ' + teamB.grp + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    stripeHtml + // <-- O CARROSSEL CENTRALIZADO AQUI!

    '<div class="section">' +
      '<div class="section-title">Vis\u00e3o Geral <small>\u00faltimos 2 anos</small></div>' +
      '<div class="overview-grid">' +
        '<div class="card stat-card"><div class="stat-value" style="color:var(--accent)">' + sA.winRate.toFixed(0) + '%</div><div class="stat-label">Vit\u00f3rias (A)</div><div class="stat-sub">' + teamA.name + '</div></div>' +
        '<div class="card stat-card"><div class="stat-value" style="color:var(--accent2)">' + sB.winRate.toFixed(0) + '%</div><div class="stat-label">Vit\u00f3rias (B)</div><div class="stat-sub">' + teamB.name + '</div></div>' +
        '<div class="card stat-card"><div class="stat-value" style="color:var(--accent)">' + sA.goalsScored.toFixed(1) + '</div><div class="stat-label">ⱷ Gols Marcados (A)</div><div class="stat-sub">' + sB.goalsScored.toFixed(1) + ' \u2014 Time B</div></div>' +
        '<div class="card stat-card"><div class="stat-value" style="color:var(--danger)">' + sA.goalsConceded.toFixed(1) + '</div><div class="stat-label">ⱷ Gols Sofridos (A)</div><div class="stat-sub">' + sB.goalsConceded.toFixed(1) + ' \u2014 Time B</div></div>' +
      '</div>' +
    '</div>' +

    '<div class="section">' +
      '<div class="section-title">Compara\u00e7\u00e3o Direta</div>' +
      '<div class="confronto-grid">' +
        '<div class="card"><div class="card-title">M\u00e9tricas por Jogo</div><div class="bar-compare">' + barsHtml + '</div></div>' +
        '<div class="card" style="display:flex;flex-direction:column;align-items:center;">' +
          '<div class="card-title" style="width:100%;text-align:left;">Perfil Comparativo</div>' +
          '<div class="radar-container">' + renderRadar(sA, sB) + '</div>' +
          '<div class="stats-inline" style="justify-content:center;margin-top:8px;">' +
            '<span class="stat-pill"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);margin-right:4px;"></span><span class="pill-label">' + teamA.name + '</span></span>' +
            '<span class="stat-pill"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent2);margin-right:4px;"></span><span class="pill-label">' + teamB.name + '</span></span>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="section">' +
      '<div class="section-title">Probabilidade <small>vit\u00f3ria \u00b7 empate \u00b7 derrota</small></div>' +
      '<div class="card">' +
        '<div class="prob-container">' +
          '<div style="display:flex;justify-content:space-between;margin-bottom:4px;">' +
            '<span style="color:var(--accent);font-weight:600;font-family:var(--font-display);font-size:0.9rem;">' + teamA.name + '</span>' +
            '<span style="color:var(--accent2);font-weight:600;font-family:var(--font-display);font-size:0.9rem;">' + teamB.name + '</span>' +
          '</div>' +
          '<div class="prob-bar">' +
            '<div class="prob-a" style="width:' + prob.pA + '%">' + prob.pA.toFixed(0) + '%</div>' +
            '<div class="prob-draw" style="width:' + prob.draw + '%">' + prob.draw.toFixed(0) + '%</div>' +
            '<div class="prob-b" style="width:' + prob.pB + '%">' + prob.pB.toFixed(0) + '%</div>' +
          '</div>' +
          '<div class="prob-labels">' +
            '<span><strong>' + prob.pA.toFixed(0) + '%</strong> Vit\u00f3ria</span>' +
            '<span><strong>' + prob.draw.toFixed(0) + '%</strong> Empate</span>' +
            '<span><strong>' + prob.pB.toFixed(0) + '%</strong> Vit\u00f3ria</span>' +
          '</div>' +
          '<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);display:flex;gap:24px;flex-wrap:wrap;justify-content:center;">' +
            '<div class="stat-pill"><span class="pill-label">ⱷ Gols esperados</span><span class="pill-value team-a-color">' + xG_A.toFixed(1) + '</span></div>' +
            '<div class="stat-pill"><span class="pill-label">ⱷ Gols esperados (B)</span><span class="pill-value team-b-color">' + xG_B.toFixed(1) + '</span></div>' +
            '<div class="stat-pill"><span class="pill-label">Ambos marcam</span><span class="pill-value">' + ambosMarcam.toFixed(0) + '%</span></div>' +
            '<div class="stat-pill"><span class="pill-label">Total \u26bd esperado</span><span class="pill-value">' + total_xG.toFixed(1) + '</span></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="section">' +
      '<div class="section-title">Evolu\u00e7\u00e3o <small>gols marcados \u00b7 \u00faltimos 24 meses</small></div>' +
      '<div class="three-grid">' +
        '<div class="card"><div class="card-title">' + teamA.name + ' \u2014 Gols Marcados</div><div class="sparkline">' + createHistorySparkline(hA, 'goalsScored') + '</div><div class="month-label">m\u00e9dia ' + hAavg + ' \u26bd/j \u00b7 ' + hAv + 'V ' + hAe + 'E ' + hAd + 'D</div></div>' +
        '<div class="card"><div class="card-title">' + teamB.name + ' \u2014 Gols Marcados</div><div class="sparkline">' + createHistorySparkline(hB, 'goalsScored') + '</div><div class="month-label">m\u00e9dia ' + hBavg + ' \u26bd/j \u00b7 ' + hBv + 'V ' + hBe + 'E ' + hBd + 'D</div></div>' +
        '<div class="card">' +
          '<div class="card-title">Gols Sofridos</div>' +
          '<div style="display:flex;flex-direction:column;gap:12px;padding:4px 0;">' +
            '<div><div style="display:flex;justify-content:space-between;font-size:0.75rem;margin-bottom:4px;"><span style="color:var(--accent)">' + teamA.name + '</span><span style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;">' + hAcavg + ' \u26bd/j</span></div><div class="sparkline" style="height:30px;">' + createHistorySparkline(hA, 'goalsConceded') + '</div></div>' +
            '<div><div style="display:flex;justify-content:space-between;font-size:0.75rem;margin-bottom:4px;"><span style="color:var(--accent2)">' + teamB.name + '</span><span style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;">' + hBcavg + ' \u26bd/j</span></div><div class="sparkline" style="height:30px;">' + createHistorySparkline(hB, 'goalsConceded') + '</div></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="section">' +
      '<div class="section-title">Ranking Geral <small>48 sele\u00e7\u00f5es coletadas</small></div>' +
      '<div class="card" style="padding:16px 0 0;">' +
        '<div class="group-filter" style="padding:0 16px;">' + buildGroupButtons() + '</div>' +
        '<div style="overflow-x:auto;">' +
          '<table class="data-table">' +
            '<thead><tr>' +
              '<th style="width:32px;"></th>' +
              '<th>Sele\u00e7\u00e3o</th>' +
              '<th class="num">ⱷ GM</th>' +
              '<th class="num">ⱷ GS</th>' +
              '<th class="num">ⱷ Final.</th>' +
              '<th class="num">Posse</th>' +
              '<th class="num">Recuper.</th>' +
              '<th class="num">Escant.</th>' +
              '<th class="num">Grp</th>' +
            '</tr></thead>' +
            '<tbody>' + tableHtml + '</tbody>' +
          '</table>' +
        '</div>' +
        '<div style="padding:10px 16px;font-size:0.7rem;color:var(--muted);">Mostrando ' + filtered.length + ' de 48 sele\u00e7\u00f5es disponíveis no JSON</div>' +
      '</div>' +
    '</div>' +

    '<div class="section">' +
      '<div class="section-title">Mapa Tático <small>' + teamA.name + ' \u00d7 ' + teamB.name + '</small></div>' +
      '<div class="confronto-grid">' +
        // CAMPO DO TIME A
        '<div class="card">' +
          '<div class="card-title" style="display:flex;justify-content:space-between;margin-bottom:8px;">' +
            '<span>' + teamA.name + '</span><span style="color:var(--accent);font-family:var(--font-mono);">' + getFormation(idA) + '</span>' +
          '</div>' +
          renderPitch(getFormation(idA), true) +
        '</div>' +
        // CAMPO DO TIME B
        '<div class="card">' +
          '<div class="card-title" style="display:flex;justify-content:space-between;margin-bottom:8px;">' +
            '<span>' + teamB.name + '</span><span style="color:var(--accent2);font-family:var(--font-mono);">' + getFormation(idB) + '</span>' +
          '</div>' +
          renderPitch(getFormation(idB), false) +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div style="height:48px;"></div>';

  var btns = document.querySelectorAll('.group-filter button');
  for (var bi = 0; bi < btns.length; bi++) {
    btns[bi].addEventListener('click', function() {
      var allBtns = document.querySelectorAll('.group-filter button');
      for (var bj = 0; bj < allBtns.length; bj++) { allBtns[bj].classList.remove('active'); }
      this.classList.add('active');
      currentGroup = this.getAttribute('data-gr');
      render();
    });
  }
}

function statBox(val, label, color) {
  var style = 'font-size:1.4rem;';
  if (color) style += 'color:' + color + ';';
  return '<div><div class="stat-value" style="' + style + '">' + val + '</div><div class="stat-label">' + label + '</div></div>';
}

function init() {
  var selA = document.getElementById('teamA');
  var selB = document.getElementById('teamB');

  selA.innerHTML = '';
  selB.innerHTML = '';

  for (var i = 0; i < TEAMS.length; i++) {
    var t = TEAMS[i];
    selA.innerHTML += '<option value="' + t.id + '"' + (i===0?' selected':'') + '>' + flagEmoji(t.id) + ' ' + t.name + '</option>';
    selB.innerHTML += '<option value="' + t.id + '"' + (i===33?' selected':'') + '>' + flagEmoji(t.id) + ' ' + t.name + '</option>'; 
  }

  selA.addEventListener('change', render);
  selB.addEventListener('change', render);
  
  render();
}

document.addEventListener('DOMContentLoaded', carregarDadosReais);
</script>
</body>
</html>
